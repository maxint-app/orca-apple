name: orca-example
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: "15.0"
    macOS: "12.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    PRODUCT_BUNDLE_IDENTIFIER: dev.crosspay.example
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  OrcaPackage:
    path: .
targets:
  orca-example-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/orca-example
    dependencies:
      - package: OrcaPackage
        product: Orca
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES

  orca-example-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/orca-example
    dependencies:
      - package: OrcaPackage
        product: Orca
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
